# =============================================================================
# layer.conf — Registers meta-custom with Yocto's layer system.
# Yocto requires this file to recognise meta-custom as a valid layer.
# Without it bitbake will not find any recipes in this directory.
# Priority 7 overrides meta-imx6ul (6) and meta-raspberrypi (5) where needed.
# =============================================================================

BBPATH .= ":${LAYERDIR}"

BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
             ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "meta-custom"
BBFILE_PATTERN_meta-custom = "^${LAYERDIR}/"
BBFILE_PRIORITY_meta-custom = "7"

LAYERDEPENDS_meta-custom = "core"
LAYERSERIES_COMPAT_meta-custom = "scarthgap"
