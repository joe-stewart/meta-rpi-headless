# =============================================================================
# rpi-headless.conf — Defines the rpi-headless distro.
# Sets every build knob explicitly — no inherited base distro.
# LFS philosophy: nothing implicit, nothing assumed.
# Covers toolchain, features, package exclusions, RPi config.txt defaults,
# and shared cache locations for the Gentoo build machine.
# =============================================================================

DISTRO = "rpi-headless"
DISTRO_NAME = "RPi Headless"
DISTRO_VERSION = "1.0"
DISTRO_CODENAME = "clean"

# --- Init system -------------------------------------------------------------
INIT_MANAGER = "systemd"
DISTRO_FEATURES_BACKFILL_CONSIDERED = "sysvinit"
DISTRO_FEATURES_BACKFILL_CONSIDERED += "pulseaudio"

# --- Distro features ---------------------------------------------------------
DISTRO_FEATURES = " \
    ipv4 \
    ipv6 \
    largefile \
    systemd \
    ext2 \
    seccomp \
    argp \
    xattr \
"

# --- Toolchain ---------------------------------------------------------------
TCMODE = "default"
TCLIBC = "glibc"
DEFAULTTUNE ?= "cortexa76"

# --- Optimization ------------------------------------------------------------
FULL_OPTIMIZATION = "-O2 -pipe"
DEBUG_BUILD = "0"
INHIBIT_PACKAGE_STRIP = "0"
INHIBIT_PACKAGE_DEBUG_SPLIT = "1"

# --- Preferred providers -----------------------------------------------------
PREFERRED_PROVIDER_virtual/kernel ?= "linux-raspberrypi"
PREFERRED_PROVIDER_virtual/bootloader ?= "rpi-u-boot-scr"
PREFERRED_PROVIDER_virtual/ssh ?= "openssh"
PREFERRED_PROVIDER_virtual/sh ?= "bash"

# --- No busybox --------------------------------------------------------------
PACKAGE_EXCLUDE = "busybox"

# --- Locale / timezone -------------------------------------------------------
IMAGE_LINGUAS = "en-us"
GLIBC_GENERATE_LOCALES = "en_US.UTF-8"
DEFAULT_TIMEZONE = "America/Los_Angeles"

# --- Package management ------------------------------------------------------
PACKAGE_CLASSES = "package_rpm"

# --- Shared cache ------------------------------------------------------------
DL_DIR ?= "${HOME}/Development/shared/downloads"
SSTATE_DIR ?= "${HOME}/Development/shared/sstate-cache"

# --- Reproducible builds -----------------------------------------------------
BB_SIGNATURE_HANDLER = "OEEquivHash"
BB_HASHSERVE = "auto"

# Boot partition size in KiB — needs room for kernel, dtbs, overlays
BOOT_SPACE = "131072"

# --- RPi config.txt ----------------------------------------------------------
DISABLE_SPLASH = "1"
DISABLE_RPI_BOOT_LOGO = "1"
CMDLINE_DEBUG = "console=tty1"
ENABLE_UART = "1"
HDMI_FORCE_HOTPLUG = "1"
DISABLE_VC4GRAPHICS = "1"

RPI_EXTRA_CONFIG = "\
arm_64bit=1\n\
dtoverlay=disable-wifi\n\
dtoverlay=disable-bt\n\
hdmi_safe=1\n\
disable_fw_kms_setup=1\n\
auto_initramfs=0\n\
dtparam=act_led_trigger=mmc0\n\
"
